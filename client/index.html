<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="auth.pageTitle">My List | Вхід</title>

    <link rel="stylesheet" href="style.css" />
    <script src="i18n.js" defer></script>
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- Website logo -->
    <header class="site-header">
      <img src="assets/logo.png" alt="My List" class="logo" />
      <div
        class="language-switch"
        role="group"
        aria-label="Мова інтерфейсу"
        data-i18n-aria-label="language.label"
      >
        <button
          class="language-button"
          type="button"
          data-lang="uk"
          aria-pressed="true"
        >
          UA
        </button>
        <button
          class="language-button"
          type="button"
          data-lang="en"
          aria-pressed="false"
        >
          EN
        </button>
      </div>
    </header>

    <main class="auth-container">
      <!-- LOGIN FORM -->
      <section class="auth-card" id="login-section">
        <h1 data-i18n="auth.loginTitle">УВІЙТИ</h1>

        <form id="login-form">
          <input
            type="email"
            name="email"
            placeholder="Електронна пошта"
            aria-label="Електронна пошта"
            data-i18n-placeholder="auth.email"
            data-i18n-aria-label="auth.email"
            autocomplete="email"
            required
          />

          <input
            type="password"
            name="password"
            placeholder="Пароль"
            aria-label="Пароль"
            data-i18n-placeholder="auth.password"
            data-i18n-aria-label="auth.password"
            autocomplete="current-password"
            required
          />
          <button type="submit" class="submit-btn" data-i18n="auth.loginButton">
            УВІЙТИ
          </button>

          <p class="auth-switch">
            <span data-i18n="auth.noAccount">Немає облікового запису?</span>
            <button
              type="button"
              id="show-register"
              data-i18n="auth.registerLink"
            >
              Реєстрація
            </button>
          </p>

          <p
            class="form-message"
            id="login-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>

      <!-- REGISTER FORM -->
      <section class="auth-card" id="register-section" hidden>
        <h1 data-i18n="auth.registerTitle">РЕЄСТРАЦІЯ</h1>

        <form id="register-form">
          <input
            type="text"
            name="username"
            placeholder="Ім’я користувача"
            aria-label="Ім’я користувача"
            data-i18n-placeholder="auth.username"
            data-i18n-aria-label="auth.username"
            autocomplete="username"
            minlength="2"
            maxlength="50"
            required
          />

          <input
            type="email"
            name="email"
            placeholder="Електронна пошта"
            aria-label="Електронна пошта"
            data-i18n-placeholder="auth.email"
            data-i18n-aria-label="auth.email"
            autocomplete="email"
            required
          />

          <input
            type="password"
            name="password"
            placeholder="Пароль"
            aria-label="Пароль"
            data-i18n-placeholder="auth.password"
            data-i18n-aria-label="auth.password"
            autocomplete="new-password"
            minlength="10"
            required
          />

          <input
            type="password"
            name="confirmPassword"
            placeholder="Підтвердіть пароль"
            aria-label="Підтвердіть пароль"
            data-i18n-placeholder="auth.confirmPassword"
            data-i18n-aria-label="auth.confirmPassword"
            autocomplete="new-password"
            minlength="10"
            required
          />

          <button
            type="submit"
            class="submit-btn"
            data-i18n="auth.registerButton"
          >
            ЗАРЕЄСТРУВАТИСЯ
          </button>

          <p class="auth-switch">
            <span data-i18n="auth.haveAccount">Уже маєте обліковий запис?</span>
            <button type="button" id="show-login" data-i18n="auth.loginLink">
              Увійти
            </button>
          </p>

          <p
            class="form-message"
            id="register-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </main>
  </body>
</html>
